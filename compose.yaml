name: laborqa

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./deploy/.env

    environment:
      HF_HOME: /app/model-cache/huggingface

    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./model-cache:/app/model-cache

    expose:
      - "8000"

    restart: unless-stopped
    init: true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
